version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: blackedition-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: blackedition
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: blackedition-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Frontend (optional for containerized development)
  # web:
  #   build:
  #     context: .
  #     dockerfile: ./apps/web/Dockerfile
  #   container_name: blackedition-web
  #   restart: unless-stopped
  #   ports:
  #     - '3000:3000'
  #   environment:
  #     - NODE_ENV=development
  #   depends_on:
  #     - postgres
  #     - redis
  #     - api
  #   volumes:
  #     - ./apps/web:/app
  #     - /app/node_modules

  # Express API (optional for containerized development)
  # api:
  #   build:
  #     context: .
  #     dockerfile: ./apps/api/Dockerfile
  #   container_name: blackedition-api
  #   restart: unless-stopped
  #   ports:
  #     - '4000:4000'
  #   environment:
  #     - NODE_ENV=development
  #     - DATABASE_URL=postgresql://postgres:password@postgres:5432/blackedition
  #     - REDIS_URL=redis://redis:6379
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   volumes:
  #     - ./apps/api:/app
  #     - /app/node_modules

volumes:
  postgres_data:
  redis_data:
